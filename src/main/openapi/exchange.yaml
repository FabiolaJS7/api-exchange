openapi: 3.0.2
info:
  title: Swagger Exchange API - OpenAPI 3.0
  description: |-
    This is a API for ABC Bank, which needs to add a feature to its mobile application a feature that allows users to consult exchange rates only with DNI information. Each DNI can make up to 10 inquiries per day.
  version: 1.0.0-SNAPSHOT
tags:
  - name: exchage
    description: Getting exchange of day
    externalDocs:
      description: Find out more
      url: https://swagger.io
paths:
  /exchange/{dni}:
    get:
      tags:
        - exchange
      summary: Getting exchange by DNI
      description: Getting exchange by DNI
      operationId: getExchangeByDni
      parameters:
        - name: dni
          in: path
          description: ID of person
          required: true
          schema:
            type: string
            example: "45986988"
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExchangeRate'
        '400':
          description: invalid DNI
        '404':
          description: Maxim limit enquiry at day is 10
        default:
          description: Unexpected error

components:
  schemas:
    ExchangeRate:
      type: object
      properties:
        dateToday:
          type: string
          format: date
          example: 11/08/2025
        exchangeRateSunat:
          type: number
          example: 3.70
        buy:
          type: number
          example: 3.70
        sell:
          type: number
          example: 3.70
        message:
          type: string
        status:
          type: boolean
    Person:
      type: object
      properties:
        dni:
          type: string
          example: 45895877
  requestBodies:
    Person:
      description: Pet object that needs to be added to the store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Person'
